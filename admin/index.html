<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · Malus Lens</title>
  <link rel="icon" type="image/png" href="/images/brand/favicon-64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css?v=2" />
</head>
<body>
  <!-- login -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="login-form" novalidate>
      <img src="/images/brand/malus-lens-logo.png" alt="Malus Lens" class="login__logo" />
      <h1>Website admin</h1>
      <p class="muted">Sign in to edit the Malus Lens website.</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required /></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="err" role="alert" id="login-err"></p>
      <button class="btn btn--red btn--block" type="submit">Sign in</button>
      <a class="muted small" href="/">← Back to website</a>
    </form>
  </main>

  <!-- editor -->
  <div class="app" id="app" hidden>
    <header class="bar">
      <a class="bar__brand" href="/" target="_blank" rel="noopener"><img src="/images/brand/malus-lens-icon.png" alt="" /><b>Malus Lens</b><span>Website admin</span></a>
      <div class="seg" role="group" aria-label="Preview size">
        <button type="button" data-view="desktop" aria-pressed="true" title="Desktop preview"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button type="button" data-view="mobile" aria-pressed="false" title="Phone preview"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg></button>
      </div>
      <span class="status" id="status" aria-live="polite">All changes published</span>
      <div class="bar__act">
        <button class="btn btn--ghost btn--sm" type="button" id="discard" disabled>Discard changes</button>
        <button class="btn btn--red btn--sm" type="button" id="publish" disabled>Publish</button>
        <button class="icon" type="button" id="logout" title="Log out" aria-label="Log out"><svg viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></button>
      </div>
    </header>
    <div class="work">
      <section class="stage" aria-label="Live preview">
        <p class="hint">Click any text in the preview to type over it. Click a photo to replace it. Lists marked <b>Edit in side panel</b> open their editor on the right.</p>
        <div class="frame" id="frame-wrap"><iframe id="frame" title="Website preview"></iframe></div>
      </section>
      <aside class="panel" aria-label="Editor">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="text" aria-selected="true">Text</button>
          <button role="tab" data-tab="photos" aria-selected="false">Photos</button>
          <button role="tab" data-tab="testimonials" aria-selected="false">Testimonials</button>
          <button role="tab" data-tab="figures" aria-selected="false">Figures</button>
          <button role="tab" data-tab="cards" aria-selected="false">Cards</button>
          <button role="tab" data-tab="contact" aria-selected="false">Contact</button>
        </nav>
        <div class="pane" id="pane" role="tabpanel"></div>
      </aside>
    </div>
  </div>
  <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/admin/admin.js?v=2"></script>
</body>
</html>
